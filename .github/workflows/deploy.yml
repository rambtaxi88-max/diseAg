name: Deploy static site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload website files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "index.html,*.js,*.css,images,media"
          target: "/tmp/morningtax-deploy"

      - name: Publish website
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /var/backups
            tar -czf "/var/backups/morningtax-$(date +%Y%m%d-%H%M%S).tar.gz" -C /var/www/html . || true
            find /var/www/html -mindepth 1 ! -name ".well-known" -exec rm -rf {} +
            cp -r /tmp/morningtax-deploy/. /var/www/html/
            chown -R www-data:www-data /var/www/html
            nginx -t
            systemctl reload nginx
            rm -rf /tmp/morningtax-deploy
