name: Deploy website to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Prepare static website files
        run: |
          rm -rf deploy
          mkdir -p deploy

          rsync -a \
            --exclude ".git" \
            --exclude ".github" \
            ./ deploy/

      - name: Upload files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/*"
          target: "/tmp/morningtax-deploy"
          strip_components: 1
          overwrite: true

      - name: Publish website
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cp -a /var/www/html "/var/www/html-backup-$(date +%F-%H%M)"
            rm -rf /var/www/html/*
            cp -a /tmp/morningtax-deploy/. /var/www/html/
            chown -R www-data:www-data /var/www/html

            nginx -t
            systemctl reload nginx
            rm -rf /tmp/morningtax-deploy
